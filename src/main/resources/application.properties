spring.application.name=Ferreteria

#Configuraciones generales de la BD
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria?connectionTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuraciones JPA
spring.jpa.hibernate.ddl-auto=update

#Le dice a Tomcat que no guarde los archivos temporales de sesión en la carpeta AppData\Local\Temp de Windows, sino en una
# carpetita tmp dentro de tu mismo proyecto. Así te olvidás de los conflictos de permisos en Windows y arranca de inmediato
server.servlet.session.store-dir=./tmp